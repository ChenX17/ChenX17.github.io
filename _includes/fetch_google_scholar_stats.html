<script>
    document.addEventListener('DOMContentLoaded', function () {
        var totalCitationElement = document.getElementById('total_cit');
        var paperCitationElements = document.getElementsByClassName('show_paper_citations');

        if (!totalCitationElement && paperCitationElements.length === 0) {
            return;
        }

        var citationDataUrls = [
            'https://cdn.jsdelivr.net/gh/{{ site.repository }}@google-scholar-stats/gs_data.json',
            'https://raw.githubusercontent.com/{{ site.repository }}/google-scholar-stats/gs_data.json'
        ];

        function fetchCitationData(index) {
            if (index >= citationDataUrls.length) {
                return Promise.reject(new Error('Citation data is unavailable'));
            }

            return fetch(citationDataUrls[index], { cache: 'no-store' })
                .then(function (response) {
                    if (!response.ok) {
                        throw new Error('Citation request failed');
                    }
                    return response.json();
                })
                .catch(function () {
                    return fetchCitationData(index + 1);
                });
        }

        fetchCitationData(0)
            .then(function (data) {
                if (totalCitationElement && Number.isFinite(Number(data.citedby))) {
                    totalCitationElement.textContent = Number(data.citedby).toLocaleString() + ' citations';
                }

                Array.prototype.forEach.call(paperCitationElements, function (element) {
                    var paperId = element.getAttribute('data');
                    var publication = data.publications && data.publications[paperId];

                    if (publication && Number.isFinite(Number(publication.num_citations))) {
                        element.textContent = '| Citations: ' + Number(publication.num_citations).toLocaleString();
                    }
                });
            })
            .catch(function () {
                // The Google Scholar profile link remains usable when live stats are unavailable.
            });
    });
</script>
